<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.app {
  width: 100%;
  max-width: 650px;
  height: 90vh;
  background: #111827;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.header {
  padding: 20px;
  background: #1f2937;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #374151;
}

.logo {
  width: 50px;
  height: 50px;
  background: #2563eb;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
}

.header h1 {
  font-size: 25px;
}

.header p {
  color: #9ca3af;
  margin-top: 4px;
  font-size: 14px;
}

.chat-box {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  max-width: 85%;
}

.user {
  margin-left: auto;
  flex-direction: row-reverse;
}

.avatar {
  min-width: 35px;
  width: 35px;
  height: 35px;
  background: #2563eb;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.user .avatar {
  background: #16a34a;
}

.bubble {
  background: #263244;
  padding: 12px 15px;
  border-radius: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user .bubble {
  background: #2563eb;
}

.input-area {
  padding: 15px;
  background: #1f2937;
  display: flex;
  gap: 10px;
}

#userInput {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #4b5563;
  border-radius: 12px;
  outline: none;
  background: #111827;
  color: white;
  font-size: 15px;
}

#userInput::placeholder {
  color: #9ca3af;
}

#sendButton {
  padding: 0 20px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#sendButton:hover {
  background: #1d4ed8;
}

@media (max-width: 600px) {
  body {
    align-items: stretch;
  }

  .app {
    height: 100vh;
    border-radius: 0;
  }

  .message {
    max-width: 92%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">🤖</div>
    <div>
      <h1>Astra AI</h1>
      <p>Your AI Chat Assistant</p>
    </div>
  </header>

  <main id="chatBox" class="chat-box">

    <div class="message bot">
      <div class="avatar">🤖</div>
      <div class="bubble">
        Hello! 👋 I am Astra AI.
        How can I help you today?
      </div>
    </div>

  </main>

  <div class="input-area">

    <input
      id="userInput"
      type="text"
      placeholder="Ask Astra AI anything..."
    >

    <button id="sendButton">Send</button>

  </div>

</div>

<script>

const input = document.getElementById("userInput");
const chatBox = document.getElementById("chatBox");
const sendButton = document.getElementById("sendButton");

function addMessage(text, type) {

  const message = document.createElement("div");
  message.className = "message " + type;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = type === "bot" ? "🤖" : "👤";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(avatar);
  message.appendChild(bubble);

  chatBox.appendChild(message);

  chatBox.scrollTop = chatBox.scrollHeight;
}

function getReply(message) {

  const text = message.toLowerCase();

  if (
    text.includes("hello") ||
    text.includes("hi") ||
    text.includes("hey")
  ) {
    return "Hello! 👋 Welcome to Astra AI. How can I help you?";
  }

  if (
    text.includes("your name") ||
    text.includes("who are you")
  ) {
    return "I am Astra AI 🤖, your AI chat assistant.";
  }

  if (text.includes("how are you")) {
    return "I'm doing great! 😊 Thanks for asking.";
  }

  if (text.includes("help")) {
    return "Sure! 🤝 Tell me what you need help with.";
  }

  if (text.includes("thank")) {
    return "You're welcome! 😊";
  }

  if (text.includes("bye")) {
    return "Goodbye! 👋 See you again.";
  }

  if (text.includes("what can you do")) {
    return "I can chat with you and answer basic questions. 🚀";
  }

  return "You said: " + message +
         "\n\nI'm still learning. 🧠";
}

function sendMessage() {

  const message = input.value.trim();

  if (message === "") return;

  addMessage(message, "user");

  input.value = "";

  setTimeout(() => {

    const reply = getReply(message);

    addMessage(reply, "bot");

  }, 700);
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});

</script>

</body>
</html>
